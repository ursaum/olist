name: Atualizar e publicar dashboard

on:
  schedule:
    - cron: "0 9 * * *"        # todo dia às 06:00 (horário de Brasília)
  push:
    branches: [claude/loving-heisenberg-7fhdtl]
  workflow_dispatch:
    inputs:
      olist_since:
        description: "Buscar pedidos do Olist desde (AAAA-MM-DD); vazio = últimos 60 dias"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: dashboard-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar pedidos recentes na Shopify
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: |
          if [ -z "$SHOPIFY_ADMIN_TOKEN" ] || [ -z "$SHOPIFY_STORE_DOMAIN" ]; then
            echo "Segredos SHOPIFY_STORE_DOMAIN / SHOPIFY_ADMIN_TOKEN não configurados; usando só os dados já salvos."
            exit 0
          fi
          python3 scripts/fetch_shopify.py --out data/shopify/api-orders.json

      - name: Buscar pedidos do Mercado Livre no Olist Tiny
        env:
          OLIST_TINY_TOKEN: ${{ secrets.OLIST_TINY_TOKEN }}
          OLIST_CHANNELS: ${{ vars.OLIST_CHANNELS }}
          OLIST_SINCE: ${{ inputs.olist_since }}
        run: |
          if [ -z "$OLIST_TINY_TOKEN" ]; then
            echo "Segredo OLIST_TINY_TOKEN não configurado; pulando o Olist."
            exit 0
          fi
          if [ -n "$OLIST_SINCE" ]; then
            python3 scripts/fetch_olist.py --since "$OLIST_SINCE" --out data/olist/orders.json
          else
            python3 scripts/fetch_olist.py --out data/olist/orders.json
          fi

      - name: Salvar pedidos acumulados no repositório
        run: |
          for f in data/shopify/api-orders.json data/olist/orders.json; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Sem pedidos novos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza pedidos das APIs ($(date -u +%Y-%m-%d))"
          git push

      - name: Gerar dados do dashboard
        run: python3 scripts/build_shopify.py --in 'data/shopify/*.json' 'data/olist/*.json' --out dashboard

      - name: Publicar no GitHub Pages (branch gh-pages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dashboard
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publica dashboard ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
