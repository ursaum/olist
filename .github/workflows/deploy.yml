name: Atualizar e publicar dashboard

on:
  schedule:
    - cron: "0 9 * * *"        # todo dia às 06:00 (horário de Brasília)
  push:
    branches: [claude/loving-heisenberg-7fhdtl]
  workflow_dispatch:
    inputs:
      olist_since:
        description: "Buscar pedidos do Olist desde (AAAA-MM-DD); vazio = últimos 60 dias"
        required: false
        default: ""
      meta_since:
        description: "Buscar métricas do Meta Ads desde (AAAA-MM-DD); vazio = últimos 60 dias"
        required: false
        default: ""
      ga_since:
        description: "Buscar métricas do Google Analytics desde (AAAA-MM-DD); vazio = últimos 60 dias"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: dashboard-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # histórico completo para o rebase do commit de dados

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # As buscas nas APIs rodam só no agendamento diário e na execução manual;
      # um push de código republica com os dados já salvos, em segundos.
      - name: Buscar pedidos recentes na Shopify
        if: github.event_name != 'push'
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: |
          if [ -z "$SHOPIFY_ADMIN_TOKEN" ] || [ -z "$SHOPIFY_STORE_DOMAIN" ]; then
            echo "Segredos SHOPIFY_STORE_DOMAIN / SHOPIFY_ADMIN_TOKEN não configurados; usando só os dados já salvos."
            exit 0
          fi
          python3 scripts/fetch_shopify.py --out data/shopify/api-orders.json

      - name: Buscar pedidos do Mercado Livre no Olist Tiny
        if: github.event_name != 'push'
        env:
          OLIST_TINY_TOKEN: ${{ secrets.OLIST_TINY_TOKEN }}
          OLIST_CHANNELS: ${{ vars.OLIST_CHANNELS }}
          OLIST_SINCE: ${{ inputs.olist_since }}
        run: |
          if [ -z "$OLIST_TINY_TOKEN" ]; then
            echo "Segredo OLIST_TINY_TOKEN não configurado; pulando o Olist."
            exit 0
          fi
          if [ -n "$OLIST_SINCE" ]; then
            python3 scripts/fetch_olist.py --since "$OLIST_SINCE" --out data/olist/orders.json
          else
            python3 scripts/fetch_olist.py --out data/olist/orders.json
          fi

      - name: Buscar métricas das campanhas no Meta Ads
        if: github.event_name != 'push'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ vars.META_AD_ACCOUNT_ID }}
          META_SINCE: ${{ inputs.meta_since }}
        run: |
          if [ -z "$META_ACCESS_TOKEN" ] || [ -z "$META_AD_ACCOUNT_ID" ]; then
            echo "Segredo META_ACCESS_TOKEN / variável META_AD_ACCOUNT_ID não configurados; pulando o Meta Ads."
            exit 0
          fi
          if [ -n "$META_SINCE" ]; then
            python3 scripts/fetch_meta.py --since "$META_SINCE" --out data/meta/insights.json
          else
            python3 scripts/fetch_meta.py --out data/meta/insights.json
          fi

      - name: Buscar métricas do site no Google Analytics
        if: github.event_name != 'push'
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID }}
          GA_SINCE: ${{ inputs.ga_since }}
        run: |
          if [ -z "$GA_SERVICE_ACCOUNT_JSON" ] || [ -z "$GA_PROPERTY_ID" ]; then
            echo "Segredo GA_SERVICE_ACCOUNT_JSON / variável GA_PROPERTY_ID não configurados; pulando o Google Analytics."
            exit 0
          fi
          pip install -q google-auth requests
          if [ -n "$GA_SINCE" ]; then
            python3 scripts/fetch_ga.py --since "$GA_SINCE" --out data/ga/analytics.json
          else
            python3 scripts/fetch_ga.py --out data/ga/analytics.json
          fi

      - name: Salvar pedidos acumulados no repositório
        run: |
          for f in data/shopify/api-orders.json data/olist/orders.json data/meta/insights.json data/ga/analytics.json; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Sem pedidos novos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza pedidos das APIs ($(date -u +%Y-%m-%d))"
          # outro push pode ter chegado durante a busca (que leva minutos): rebase e tenta de novo
          n=0
          until git pull --rebase origin "$GITHUB_REF_NAME" && git push; do
            n=$((n+1)); [ "$n" -ge 3 ] && exit 1
            sleep 20
          done

      - name: Gerar dados do dashboard
        run: |
          python3 scripts/build_shopify.py --in 'data/shopify/*.json' 'data/olist/*.json' --out dashboard
          python3 scripts/build_meta.py --in data/meta/insights.json --out dashboard
          python3 scripts/build_ga.py --in data/ga/analytics.json --out dashboard

      - name: Publicar no GitHub Pages (branch gh-pages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dashboard
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publica dashboard ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
